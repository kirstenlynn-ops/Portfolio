<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kirsten Livingston Portfolio</title>
  <style>
    /* General Styling */
    body { margin:0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    a { text-decoration: none; }

    /* Header / Hero Section */
    header {
      background: url('hero-image.jpg') no-repeat center center;
      background-size: cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }
    header h1 { font-size: 4em; margin: 0; }
    header p { font-size: 1.5em; margin: 10px 0 30px; max-width: 700px; }

    /* Buttons */
    .hero-button {
      background-color: #E67E22;
      color: white;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 5px;
      font-size: 1.2em;
      transition: 0.3s;
    }
    .hero-button:hover { background-color: #D35400; }

    /* Navigation Bar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #34495E;
      display: flex;
      justify-content: center;
      z-index: 100;
    }
    nav a {
      color: white;
      padding: 14px 20px;
      display: inline-block;
    }
    nav a:hover { background-color: #E67E22; color: white; }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      background-color: #2C3E50;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Hero Section -->
  <header>
    <h1>Kirsten Livingston</h1>
    <p>Emerging Data Scientist turning raw data into actionable insights.</p>
    <div>
      <a href="about.html" class="hero-button">About Me</a>
      <a href="portfolio.html" class="hero-button">My Work</a>
      <a href="contact.html" class="hero-button">Contact</a>
    </div>
  </header>

  <!-- Footer -->
  <footer>
    &copy; 2026 Kirsten Livingston
  </footer>

</body>
</html>
