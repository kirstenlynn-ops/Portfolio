<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Kirsten Livingston</title>
  <style>
    body { margin:0; font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #2C3E50; }
    a { text-decoration: none; color: inherit; }

    /* Navigation Bar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #34495E;
      display: flex;
      justify-content: center;
      z-index: 100;
    }
    nav a {
      color: white;
      padding: 16px 20px;
      display: inline-block;
      font-weight: bold;
    }
    nav a:hover { background-color: #2980B9; }

    /* Header */
    header {
      height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #5DADE2, #48C9B0);
      color: white;
    }
    header h1 { font-size: 3em; margin: 10px 0; }
    header h2 { font-size: 1.5em; margin: 5px 0; }

    /* Contact Section */
    section {
      padding: 50px 20px;
      max-width: 600px;
      margin: auto;
      background-color: #ECF0F1;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      margin-top: -50px;
    }

    form { display: flex; flex-direction: column; }
    label { margin: 10px 0 5px; font-weight: bold; }
    input, textarea {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #BDC3C7;
      font-size: 1em;
    }
    textarea { resize: vertical; min-height: 100px; }
    button {
      margin-top: 20px;
      padding: 12px;
      background-color: #2980B9;
      color: white;
      font-size: 1.1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background-color: #1F618D; }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      background-color: #2C3E50;
      color: white;
      font-size: 0.9em;
    }
    footer a { color: #5DADE2; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Header -->
  <header>
    <h1>Contact Me ✉️</h1>
    <h2>Let's Connect!</h2>
  </header>

  <!-- Contact Form Section -->
  <section>
    <form>
      <label for="name">Name 🧑‍💻</label>
      <input type="text" id="name" name="name" placeholder="Your Name">

      <label for="email">Email 📧</label>
      <input type="email" id="email" name="email" placeholder="Your Email">

      <label for="message">Message 💬</label>
      <textarea id="message" name="message" placeholder="Write your message here..."></textarea>

      <button type="submit">Send Message 🚀</button>
    </form>

    <div style="text-align:center; margin-top:30px;">
      <p>Or reach me directly:</p>
      <p>📧 <a href="mailto:lynnmarieliving@gmail.com">lynnmarieliving@gmail.com</a></p>
      <p>🔗 <a href="https://github.com/kirstenlynn-ops" target="_blank">GitHub</a></p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    &copy; 2026 Kirsten Livingston
  </footer>

</body>
</html>
